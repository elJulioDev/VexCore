name: VexCore SAST Scan

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - run: uv sync --locked

      # Findings make vexcore exit 1; that must not block the SARIF upload.
      # Gating happens in Code Scanning ("vexcore" check on PRs), not here.
      - name: Run VexCore
        run: uv run vexcore . --output sarif > sarif.json
        continue-on-error: true

      - name: Validate SARIF
        run: python3 -c "import json; d = json.load(open('sarif.json')); assert d.get('runs'), 'empty SARIF'"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif.json
