crawler:
  # ignore_dirs y scan_extensions usan por defecto las listas de
  # vexcore/crawler.py (DEFAULT_IGNORE_DIRS / DEFAULT_SCAN_EXTENSIONS), que
  # cubren todos los lenguajes con reglas. Si las defines aquí, REEMPLAZAN
  # a las de por defecto (no se suman):
  #
  # ignore_dirs: [.git, node_modules, venv]
  # scan_extensions: [.py, .js, .php]
  max_file_size_mb: 5
  follow_symlinks: false

analyzers:
  sast:
    enabled: true
  secrets:
    enabled: true
  sca:
    enabled: false
    source: both       # both, osv, o local
  config:
    enabled: false

plugins_dir: plugins

incremental: false

output:
  severity_threshold: low